name: Cerebellum PYQ Automated Extraction

on:
  push:
    branches: [cerebellum-pyq-phase1]
    paths:
      - 'reconstruction/automation/pyq_extract.py'
      - '.github/workflows/cerebellum-pyq-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone source repository
        run: git clone --depth 1 https://github.com/sunday2212/WEBREPLITX5.git source_repo
      - name: Run automated PYQ extraction and mapping
        run: python3 reconstruction/automation/pyq_extract.py
      - name: Validate generated artifacts
        run: |
          test -s reconstruction/generated/pyq/pyq_records.json
          test -s reconstruction/generated/pyq/pyq_year_summary.json
          test -s reconstruction/generated/pyq/pyq_audit.json
          python3 - <<'PY'
          import json
          a=json.load(open('reconstruction/generated/pyq/pyq_audit.json'))
          assert a['source_files'] == 41, a
          assert a['questions'] > 0, a
          assert a['mapped_total'] + a['unresolved'] + a['ambiguous_exact'] == a['questions'], a
          print(json.dumps(a, indent=2))
          PY
      - name: Build completeness and duplicate profile
        run: |
          python3 - <<'PY'
          import json, collections, pathlib
          base=pathlib.Path('reconstruction/generated/pyq')
          records=json.load(open(base/'pyq_records.json'))
          fields=['source_record','source_record.text','source_record.choices','source_record.solution','source_record.correct_choice_id','source_record.explanation_images','source_record.question_images']
          def get(r,path):
              v=r
              for p in path.split('.'):
                  if isinstance(v,dict): v=v.get(p)
                  else: return None
              return v
          completeness={'records':len(records),'fields':{}}
          for f in fields:
              vals=[get(r,f) for r in records]
              completeness['fields'][f]={'present':sum(v not in (None,'',[]) for v in vals),'missing':sum(v in (None,'',[]) for v in vals)}
          status=collections.Counter(r.get('classification_status') for r in records)
          completeness['classification_status']=dict(sorted(status.items()))
          completeness['invariant_total']=sum(status.values())
          hashes=collections.defaultdict(list)
          for r in records:
              h=r.get('question_hash')
              if h: hashes[h].append((r.get('year'),r.get('source_file'),r.get('source_index')))
          groups=[v for v in hashes.values() if len(v)>1]
          duplicate={'unique_question_hashes':len(hashes),'duplicate_groups':len(groups),'records_in_duplicate_groups':sum(map(len,groups)),
                     'note':'Repeated questions are retained. Duplication is profiled only; it is not treated as a mapping error.'}
          json.dump(completeness,open(base/'pyq_completeness_audit.json','w'),ensure_ascii=False,indent=2)
          json.dump(duplicate,open(base/'pyq_duplicate_profile.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Build subject-year and unresolved packages
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          base=pathlib.Path('reconstruction/generated/pyq')
          records=json.load(open(base/'pyq_records.json'))
          out=base/'packages'
          out.mkdir(parents=True,exist_ok=True)
          subject_names={
            1:'Biochemistry',2:'Physiology',3:'Anatomy',4:'Pharmacology',5:'Pathology',
            6:'Microbiology',7:'Preventive & Social Medicine',8:'Ophthalmology',9:'ENT',
            10:'Forensic Medicine',11:'Medicine',12:'Surgery',13:'Pediatrics',
            14:'Obstetrics & Gynecology',15:'Orthopedics',16:'Psychiatry',17:'Radiology',
            18:'Dermatology',19:'Anesthesia'
          }
          def safe(s): return re.sub(r'[^A-Za-z0-9._-]+','_',s).strip('_') or 'Unknown'
          index={'subjects':{},'years':{},'unresolved':{},'total_records':len(records),'mapped_records':0,'unresolved_records':0}
          buckets={}
          unresolved={}
          for r in records:
              year=r.get('year','Unknown')
              st=r.get('classification_status')
              if st=='UNRESOLVED':
                  unresolved.setdefault(year,[]).append(r)
                  continue
              cands=r.get('subject_candidates') or []
              if len(cands)!=1 or cands[0] not in subject_names.values(): continue
              subj=cands[0]
              index['mapped_records']+=1
              buckets.setdefault((subj,year),[]).append(r)
          index['unresolved_records']=sum(len(v) for v in unresolved.values())
          for (subj,year),rows in buckets.items():
              d=out/'subject_year'/safe(subj)
              d.mkdir(parents=True,exist_ok=True)
              json.dump(rows,open(d/f'{safe(year)}.json','w'),ensure_ascii=False,indent=2)
              index['subjects'].setdefault(subj,{})[year]=len(rows)
              index['years'][year]=index['years'].get(year,0)+len(rows)
          for year,rows in unresolved.items():
              d=out/'unresolved'; d.mkdir(parents=True,exist_ok=True)
              json.dump(rows,open(d/f'{safe(year)}.json','w'),ensure_ascii=False,indent=2)
              index['unresolved'][year]=len(rows)
          json.dump(index,open(out/'pyq_subject_year_manifest.json','w'),ensure_ascii=False,indent=2)
          assert index['mapped_records'] + index['unresolved_records'] == len(records), index
          print(json.dumps(index,indent=2))
          PY
      - name: Build QBank-ready normalized packages
        run: |
          python3 - <<'PY'
          import json, pathlib, re, hashlib
          base=pathlib.Path('reconstruction/generated/pyq')
          recs=json.load(open(base/'pyq_records.json'))
          out=base/'qbank_ready'; out.mkdir(parents=True,exist_ok=True)
          subjects=sorted({(r.get('subject_candidates') or [None])[0] for r in recs if len(r.get('subject_candidates') or [])==1})
          index={'records':len(recs),'mapped':0,'unresolved':0,'subjects':{},'validation':{'correct_choice_mismatch':0,'choice_count_distribution':{}}}
          for r in recs:
              cands=r.get('subject_candidates') or []
              if len(cands)==1:
                  index['mapped']+=1
                  subj=cands[0]; index['subjects'][subj]=index['subjects'].get(subj,0)+1
              else: index['unresolved']+=1
              src=r.get('source_record') or {}
              choices=src.get('choices') or []
              n=len(choices); index['validation']['choice_count_distribution'][str(n)]=index['validation']['choice_count_distribution'].get(str(n),0)+1
              ids={str(x.get('id')) for x in choices if isinstance(x,dict) and x.get('id') is not None}
              cid=str(src.get('correct_choice_id'))
              if cid not in ids: index['validation']['correct_choice_mismatch']+=1
          assert index['mapped']+index['unresolved']==len(recs), index
          assert index['validation']['correct_choice_mismatch']==0, index
          json.dump(index,open(out/'qbank_ready_manifest.json','w'),ensure_ascii=False,indent=2)
          json.dump([{
              'id':src.get('id'),'year':r.get('year'),'subject':(r.get('subject_candidates') or [None])[0],
              'text':src.get('text'),'choices':src.get('choices'),'correct_choice_id':src.get('correct_choice_id'),
              'solution':src.get('solution'),'question_images':src.get('question_images'),
              'explanation_images':src.get('explanation_images'),'source_file':r.get('source_file'),
              'source_index':r.get('source_index'),'classification_status':r.get('classification_status')
          } for r in recs],open(out/'qbank_records.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(index,indent=2))
          PY
      - name: Build standalone interactive PYQ QBank HTML
        run: |
          python3 - <<'PY'
          import json, pathlib, html
          base=pathlib.Path('reconstruction/generated/pyq')
          recs=json.load(open(base/'pyq_records.json'))
          out=base/'qbank_ready'; out.mkdir(parents=True,exist_ok=True)
          data=[]
          for r in recs:
              s=r.get('source_record') or {}
              choices=s.get('choices') or []
              data.append({
                'id':s.get('id'),'year':r.get('year'),
                'subject':(r.get('subject_candidates') or [None])[0],
                'status':r.get('classification_status'),
                'text':s.get('text') or '',
                'choices':choices,
                'correct_choice_id':s.get('correct_choice_id'),
                'solution':s.get('solution') or '',
                'question_images':s.get('question_images') or [],
                'explanation_images':s.get('explanation_images') or []
              })
          payload=json.dumps(data,ensure_ascii=False,separators=(',',':')).replace('</script>','<\\/script>')
          template=r'''<!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Cerebellum PYQ QBank</title>
          <style>
          :root{--bg:#f5f7fa;--card:#fff;--text:#17202a;--muted:#68707a;--border:#dfe3e8;--accent:#2563eb;--ok:#16803c;--bad:#c62828}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
          header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--border);padding:12px}
          h1{font-size:18px;margin:0 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar select,.bar button{padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
          main{max-width:900px;margin:auto;padding:12px}.meta{color:var(--muted);font-size:13px;margin:8px 0}.q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}
          .qno{font-size:12px;color:var(--muted);margin-bottom:8px}.question{font-size:16px;line-height:1.55}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text)}
          .opt.correct{border-color:var(--ok);background:#eaf7ee}.opt.wrong{border-color:var(--bad);background:#fdecec}.locked .opt{cursor:default}
          .actions{display:flex;gap:8px;margin-top:10px}.actions button{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card)}
          .solution{display:none;margin-top:10px;padding:10px;border-top:1px solid var(--border);white-space:pre-wrap;line-height:1.5}.solution.show{display:block}
          .empty{padding:30px;text-align:center;color:var(--muted)}
          @media(prefers-color-scheme:dark){:root{--bg:#101214;--card:#181b1f;--text:#eef1f4;--muted:#9aa3ad;--border:#30353b;--accent:#6ea8fe}.opt.correct{background:#12331e}.opt.wrong{background:#3b1717}}
          </style></head><body>
          <header><h1>Cerebellum PYQ QBank</h1><div class="bar">
          <select id="subject"><option value="">All subjects</option></select><select id="year"><option value="">All years</option></select>
          <select id="mode"><option value="all">All questions</option><option value="mapped">Mapped only</option><option value="unresolved">Unresolved audit</option></select>
          <button id="shuffle">Shuffle</button></div><div id="meta" class="meta"></div></header>
          <main id="app"></main>
          <script id="DATA" type="application/json">''' + payload + r'''</script>
          <script>
          const DATA=JSON.parse(document.getElementById('DATA').textContent);let rows=[...DATA];
          const S=[...new Set(DATA.map(x=>x.subject).filter(Boolean))].sort(),Y=[...new Set(DATA.map(x=>x.year).filter(Boolean))].sort();
          const sub=document.getElementById('subject'),yr=document.getElementById('year'),mode=document.getElementById('mode'),app=document.getElementById('app'),meta=document.getElementById('meta');
          S.forEach(x=>sub.insertAdjacentHTML('beforeend','<option>'+esc(x)+'</option>'));Y.forEach(x=>yr.insertAdjacentHTML('beforeend','<option>'+esc(x)+'</option>'));
          function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
          function choiceText(c){return c&&typeof c==='object'?(c.text??c.value??c.label??''):String(c??'')}
          function filter(){rows=DATA.filter(r=>(!sub.value||r.subject===sub.value)&&(!yr.value||r.year===yr.value)&&(mode.value==='all'||(mode.value==='mapped'?!!r.subject:!r.subject)));meta.textContent=rows.length+' questions';render()}
          function render(){app.innerHTML=rows.length?rows.map((r,i)=>card(r,i)).join(''):'<div class="empty">No questions in this filter.</div>'}
          function card(r,i){return '<section class="q" id="q'+i+'"><div class="qno">Q'+(i+1)+' · '+esc(r.year||'')+(r.subject?' · '+esc(r.subject):' · UNRESOLVED')+'</div><div class="question">'+r.text+'</div><div class="opts">'+(r.choices||[]).map((c,j)=>'<button class="opt" data-id="'+esc(c.id)+'" onclick="pick('+i+',this)">'+String.fromCharCode(65+j)+'. '+choiceText(c)+'</button>').join('')+'</div><div class="actions"><button onclick="toggleSol('+i+')">Show / Hide Explanation</button></div><div class="solution" id="s'+i+'">'+(r.solution||'No explanation supplied in source record.')+'</div></section>'}
          function pick(i,b){const r=rows[i],q=document.getElementById('q'+i);if(q.classList.contains('locked'))return;q.classList.add('locked');q.querySelectorAll('.opt').forEach(x=>{if(String(x.dataset.id)===String(r.correct_choice_id))x.classList.add('correct')});if(String(b.dataset.id)!==String(r.correct_choice_id))b.classList.add('wrong')}
          function toggleSol(i){document.getElementById('s'+i).classList.toggle('show')}
          sub.onchange=yr.onchange=mode.onchange=filter;
          document.getElementById('shuffle').onclick=()=>{rows=[...rows].sort(()=>Math.random()-.5);render()};
          filter();
          </script></body></html>'''
          (out/'cerebellum_pyq_qbank.html').write_text(template,encoding='utf-8')
          print('Generated',out/'cerebellum_pyq_qbank.html','records=',len(data))
          PY
      - name: Inline QBank images as base64
        run: |
          python3 - <<'PY'
          import re,base64,mimetypes,urllib.request,pathlib
          p=pathlib.Path('reconstruction/generated/pyq/qbank_ready/cerebellum_pyq_qbank.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'''src=\\\"(https?://[^\\\"]+)\\\"'''
          urls=[]; seen=set()
          for u in re.findall(pattern,s,re.I):
              if u not in seen:
                  seen.add(u); urls.append(u)
          cache={}
          for i,u in enumerate(urls,1):
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  ctype=(r.headers.get_content_type() or mimetypes.guess_type(u)[0] or 'application/octet-stream').lower()
              cache[u]='data:'+ctype+';base64,'+base64.b64encode(raw).decode('ascii')
              if i%100==0: print('embedded',i,'/',len(urls))
          def repl(m):
              return 'src=\\\"'+cache[m.group(1)]+'\\\"'
          s=re.sub(pattern,repl,s,flags=re.I)
          p.write_text(s,encoding='utf-8')
          remaining=re.findall(r'''src=\\\"(https?://[^\\\"]+)\\\"''',s,re.I)
          if remaining: raise SystemExit(f'Remote image URLs remain: {len(remaining)}')
          print('unique remote images embedded:',len(urls))
          PY

      - name: Persist latest audit
        run: |
          cp reconstruction/generated/pyq/pyq_audit.json reconstruction/analysis/pyq_latest_audit.json
          cp reconstruction/generated/pyq/pyq_year_summary.json reconstruction/analysis/pyq_year_summary.json
          cp reconstruction/generated/pyq/pyq_completeness_audit.json reconstruction/analysis/pyq_completeness_audit.json
          cp reconstruction/generated/pyq/pyq_duplicate_profile.json reconstruction/analysis/pyq_duplicate_profile.json
          cp reconstruction/generated/pyq/packages/pyq_subject_year_manifest.json reconstruction/analysis/pyq_subject_year_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/analysis/pyq_latest_audit.json reconstruction/analysis/pyq_year_summary.json reconstruction/analysis/pyq_completeness_audit.json reconstruction/analysis/pyq_duplicate_profile.json reconstruction/analysis/pyq_subject_year_manifest.json
          git diff --cached --quiet || git commit -m "chore: persist latest PYQ audit [skip ci]"
          git push
      - name: Upload extraction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cerebellum-pyq-extraction
          path: reconstruction/generated/pyq/

