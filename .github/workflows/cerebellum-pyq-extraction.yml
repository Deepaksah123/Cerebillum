name: Cerebellum PYQ Automated Extraction

on:
  push:
    branches: [cerebellum-pyq-phase1]
    paths:
      - 'reconstruction/automation/pyq_extract.py'
      - '.github/workflows/cerebellum-pyq-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone source repository
        run: git clone --depth 1 https://github.com/sunday2212/WEBREPLITX5.git source_repo
      - name: Run automated PYQ extraction and mapping
        run: python3 reconstruction/automation/pyq_extract.py
      - name: Validate generated artifacts
        run: |
          test -s reconstruction/generated/pyq/pyq_records.json
          test -s reconstruction/generated/pyq/pyq_year_summary.json
          test -s reconstruction/generated/pyq/pyq_audit.json
          python3 - <<'PY'
          import json
          a=json.load(open('reconstruction/generated/pyq/pyq_audit.json'))
          assert a['source_files'] == 41, a
          assert a['questions'] > 0, a
          assert a['mapped_total'] + a['unresolved'] + a['ambiguous_exact'] == a['questions'], a
          print(json.dumps(a, indent=2))
          PY
      - name: Build completeness and duplicate profile
        run: |
          python3 - <<'PY'
          import json, collections, pathlib
          base=pathlib.Path('reconstruction/generated/pyq')
          records=json.load(open(base/'pyq_records.json'))
          fields=['source_record','source_record.text','source_record.choices','source_record.solution','source_record.correct_choice_id','source_record.explanation_images','source_record.question_images']
          def get(r,path):
              v=r
              for p in path.split('.'):
                  if isinstance(v,dict): v=v.get(p)
                  else: return None
              return v
          completeness={'records':len(records),'fields':{}}
          for f in fields:
              vals=[get(r,f) for r in records]
              completeness['fields'][f]={'present':sum(v not in (None,'',[]) for v in vals),'missing':sum(v in (None,'',[]) for v in vals)}
          status=collections.Counter(r.get('classification_status') for r in records)
          completeness['classification_status']=dict(sorted(status.items()))
          completeness['invariant_total']=sum(status.values())
          hashes=collections.defaultdict(list)
          for r in records:
              h=r.get('question_hash')
              if h: hashes[h].append((r.get('year'),r.get('source_file'),r.get('source_index')))
          groups=[v for v in hashes.values() if len(v)>1]
          duplicate={'unique_question_hashes':len(hashes),'duplicate_groups':len(groups),'records_in_duplicate_groups':sum(map(len,groups)),
                     'note':'Repeated questions are retained. Duplication is profiled only; it is not treated as a mapping error.'}
          json.dump(completeness,open(base/'pyq_completeness_audit.json','w'),ensure_ascii=False,indent=2)
          json.dump(duplicate,open(base/'pyq_duplicate_profile.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Build subject-year and unresolved packages
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          base=pathlib.Path('reconstruction/generated/pyq')
          records=json.load(open(base/'pyq_records.json'))
          out=base/'packages'
          out.mkdir(parents=True,exist_ok=True)
          subject_names={
            1:'Biochemistry',2:'Physiology',3:'Anatomy',4:'Pharmacology',5:'Pathology',
            6:'Microbiology',7:'Preventive & Social Medicine',8:'Ophthalmology',9:'ENT',
            10:'Forensic Medicine',11:'Medicine',12:'Surgery',13:'Pediatrics',
            14:'Obstetrics & Gynecology',15:'Orthopedics',16:'Psychiatry',17:'Radiology',
            18:'Dermatology',19:'Anesthesia'
          }
          def safe(s): return re.sub(r'[^A-Za-z0-9._-]+','_',s).strip('_') or 'Unknown'
          index={'subjects':{},'years':{},'unresolved':{},'total_records':len(records),'mapped_records':0,'unresolved_records':0}
          buckets={}
          unresolved={}
          for r in records:
              year=r.get('year','Unknown')
              st=r.get('classification_status')
              if st=='UNRESOLVED':
                  unresolved.setdefault(year,[]).append(r)
                  continue
              cands=r.get('subject_candidates') or []
              if len(cands)!=1 or cands[0] not in subject_names.values(): continue
              subj=cands[0]
              index['mapped_records']+=1
              buckets.setdefault((subj,year),[]).append(r)
          index['unresolved_records']=sum(len(v) for v in unresolved.values())
          for (subj,year),rows in buckets.items():
              d=out/'subject_year'/safe(subj)
              d.mkdir(parents=True,exist_ok=True)
              json.dump(rows,open(d/f'{safe(year)}.json','w'),ensure_ascii=False,indent=2)
              index['subjects'].setdefault(subj,{})[year]=len(rows)
              index['years'][year]=index['years'].get(year,0)+len(rows)
          for year,rows in unresolved.items():
              d=out/'unresolved'; d.mkdir(parents=True,exist_ok=True)
              json.dump(rows,open(d/f'{safe(year)}.json','w'),ensure_ascii=False,indent=2)
              index['unresolved'][year]=len(rows)
          json.dump(index,open(out/'pyq_subject_year_manifest.json','w'),ensure_ascii=False,indent=2)
          assert index['mapped_records'] + index['unresolved_records'] == len(records), index
          print(json.dumps(index,indent=2))
          PY
      - name: Build QBank-ready normalized packages
        run: |
          python3 - <<'PY'
          import json, pathlib, re, hashlib
          base=pathlib.Path('reconstruction/generated/pyq')
          recs=json.load(open(base/'pyq_records.json'))
          out=base/'qbank_ready'; out.mkdir(parents=True,exist_ok=True)
          subjects=sorted({(r.get('subject_candidates') or [None])[0] for r in recs if len(r.get('subject_candidates') or [])==1})
          index={'records':len(recs),'mapped':0,'unresolved':0,'subjects':{},'validation':{'correct_choice_mismatch':0,'choice_count_distribution':{}}}
          for r in recs:
              cands=r.get('subject_candidates') or []
              if len(cands)==1:
                  index['mapped']+=1
                  subj=cands[0]; index['subjects'][subj]=index['subjects'].get(subj,0)+1
              else: index['unresolved']+=1
              src=r.get('source_record') or {}
              choices=src.get('choices') or []
              n=len(choices); index['validation']['choice_count_distribution'][str(n)]=index['validation']['choice_count_distribution'].get(str(n),0)+1
              ids={str(x.get('id')) for x in choices if isinstance(x,dict) and x.get('id') is not None}
              cid=str(src.get('correct_choice_id'))
              if cid not in ids: index['validation']['correct_choice_mismatch']+=1
          assert index['mapped']+index['unresolved']==len(recs), index
          assert index['validation']['correct_choice_mismatch']==0, index
          json.dump(index,open(out/'qbank_ready_manifest.json','w'),ensure_ascii=False,indent=2)
          json.dump([{
              'id':src.get('id'),'year':r.get('year'),'subject':(r.get('subject_candidates') or [None])[0],
              'text':src.get('text'),'choices':src.get('choices'),'correct_choice_id':src.get('correct_choice_id'),
              'solution':src.get('solution'),'question_images':src.get('question_images'),
              'explanation_images':src.get('explanation_images'),'source_file':r.get('source_file'),
              'source_index':r.get('source_index'),'classification_status':r.get('classification_status')
          } for r in recs],open(out/'qbank_records.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(index,indent=2))
          PY
      - name: Persist latest audit
        run: |
          cp reconstruction/generated/pyq/pyq_audit.json reconstruction/analysis/pyq_latest_audit.json
          cp reconstruction/generated/pyq/pyq_year_summary.json reconstruction/analysis/pyq_year_summary.json
          cp reconstruction/generated/pyq/pyq_completeness_audit.json reconstruction/analysis/pyq_completeness_audit.json
          cp reconstruction/generated/pyq/pyq_duplicate_profile.json reconstruction/analysis/pyq_duplicate_profile.json
          cp reconstruction/generated/pyq/packages/pyq_subject_year_manifest.json reconstruction/analysis/pyq_subject_year_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/analysis/pyq_latest_audit.json reconstruction/analysis/pyq_year_summary.json reconstruction/analysis/pyq_completeness_audit.json reconstruction/analysis/pyq_duplicate_profile.json reconstruction/analysis/pyq_subject_year_manifest.json
          git diff --cached --quiet || git commit -m "chore: persist latest PYQ audit [skip ci]"
          git push
      - name: Upload extraction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cerebellum-pyq-extraction
          path: reconstruction/generated/pyq/

