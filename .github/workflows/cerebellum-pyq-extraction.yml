name: Cerebellum PYQ Automated Extraction

on:
  push:
    branches: [cerebellum-pyq-phase1]
    paths:
      - 'reconstruction/automation/pyq_extract.py'
      - '.github/workflows/cerebellum-pyq-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone source repository
        run: git clone --depth 1 https://github.com/sunday2212/WEBREPLITX5.git source_repo
      - name: Run automated PYQ extraction and mapping
        run: python3 reconstruction/automation/pyq_extract.py
      - name: Validate generated artifacts
        run: |
          test -s reconstruction/generated/pyq/pyq_records.json
          test -s reconstruction/generated/pyq/pyq_year_summary.json
          test -s reconstruction/generated/pyq/pyq_audit.json
          python3 - <<'PY'
          import json
          a=json.load(open('reconstruction/generated/pyq/pyq_audit.json'))
          assert a['source_files'] == 41, a
          assert a['questions'] > 0, a
          assert a['mapped_total'] + a['unresolved'] + a['ambiguous_exact'] == a['questions'], a
          print(json.dumps(a, indent=2))
          PY
      - name: Persist latest audit
        run: |
          cp reconstruction/generated/pyq/pyq_audit.json reconstruction/analysis/pyq_latest_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/analysis/pyq_latest_audit.json
          git diff --cached --quiet || git commit -m "chore: persist latest PYQ audit [skip ci]"
          git push
      - name: Upload extraction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cerebellum-pyq-extraction
          path: reconstruction/generated/pyq/

