name: Cerebellum Recovered APK Assembly Probe

on:
  push:
    branches: [cerebellum-pyq-phase1]
    paths:
      - 'reconstruction/apk_root/**'
      - 'reconstruction/analysis/pyq_apk_asset_manifest.json'
      - '.github/workflows/cerebellum-recovered-apk-assembly.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"
      - name: Assemble and validate recovered APK profiles
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ROOT="reconstruction/apk_root"
          OUT="reconstruction/native_assembly"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          assemble() {
            profile="$1"
            stage="$OUT/stage_$profile"
            mkdir -p "$stage"
            cp "$ROOT/manifest/AndroidManifest.xml" "$stage/AndroidManifest.xml"
            cp "$ROOT/resources/resources.arsc" "$stage/resources.arsc"
            cp "$ROOT/dex"/classes*.dex "$stage/"
            cp -a "$ROOT/res" "$stage/res"
            cp -a "$ROOT/assets" "$stage/assets"
            cp -a "$ROOT/lib" "$stage/lib"
            if [ "$profile" = "extended" ]; then
              cp -a "$ROOT/media" "$stage/media"
              cp -a "$ROOT/config" "$stage/config"
              cp -a "$ROOT/unknown" "$stage/unknown"
            fi
            mkdir -p "$stage/META-INF"
            find "$ROOT/META-INF" -type f ! -name 'CERT.RSA' ! -name 'CERT.SF' ! -name 'MANIFEST.MF' -exec cp --parents '{}' "$stage" \;
            (cd "$stage" && zip -q -r -0 "../\${profile}_unsigned.apk" .)
            "$BT/zipalign" -f 4 "$OUT/\${profile}_unsigned.apk" "$OUT/\${profile}_aligned.apk"
            if [ ! -f "$OUT/debug.keystore" ]; then
              keytool -genkeypair -v -keystore "$OUT/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            "$BT/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT/\${profile}_signed.apk" "$OUT/\${profile}_aligned.apk"
            "$BT/apksigner" verify --verbose "$OUT/\${profile}_signed.apk"
            "$BT/aapt2" dump badging "$OUT/\${profile}_signed.apk" > "$OUT/\${profile}_badging.txt"
            unzip -l "$OUT/\${profile}_signed.apk" > "$OUT/\${profile}_zip_listing.txt"
          }
          assemble standard
          assemble extended
          python3 - <<'PY'
          import json, pathlib, re, hashlib
          out=pathlib.Path("reconstruction/native_assembly")
          report={"status":"ASSEMBLY_PROBE_PASS","profiles":{}}
          for p in ("standard","extended"):
              apk=out/f"{p}_signed.apk"
              bad=out/f"{p}_badging.txt"
              z=out/f"{p}_zip_listing.txt"
              txt=bad.read_text(errors="replace")
              pkg=re.search(r"package: name='([^']+)'",txt)
              act=re.search(r"launchable-activity: name='([^']+)'",txt)
              report["profiles"][p]={
                "apk":str(apk),"bytes":apk.stat().st_size,
                "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
                "package":pkg.group(1) if pkg else None,
                "launchable_activity":act.group(1) if act else None,
                "qbank_asset_present":"assets/cerebellum_pyq_qbank.html" in z.read_text(errors="replace")
              }
          assert all(v["qbank_asset_present"] for v in report["profiles"].values()), report
          pathlib.Path("reconstruction/analysis/native_apk_assembly_probe.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Persist native assembly probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/analysis/native_apk_assembly_probe.json
          git diff --cached --quiet || git commit -m "Persist recovered APK assembly probe [skip ci]"
          git push
      - name: Upload assembled APK candidates
        uses: actions/upload-artifact@v4
        with:
          name: cerebellum-recovered-apk-candidates
          path: |
            reconstruction/native_assembly/standard_signed.apk
            reconstruction/native_assembly/extended_signed.apk
            reconstruction/native_assembly/*_badging.txt
            reconstruction/analysis/native_apk_assembly_probe.json
