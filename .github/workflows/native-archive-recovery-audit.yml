name: Cerebellum Native Archive Recovery Audit

on:
  push:
    branches: [cerebellum-pyq-phase1]
    paths:
      - '01_core_dex.zip'
      - '02_dex_3_4.zip'
      - '03_dex5_lib_assets.zip'
      - '04_remaining_resources.zip'
      - 'reconstruction/automation/native_archive_recovery_audit.py'
      - '.github/workflows/native-archive-recovery-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recovered archive members
        run: python3 reconstruction/automation/native_archive_recovery_audit.py
      - name: Validate recovery audit
        run: |
          test -s reconstruction/analysis/native_archive_recovery_audit.json
          python3 - <<'PY'
          import json
          p='reconstruction/analysis/native_archive_recovery_audit.json'
          d=json.load(open(p))
          print(json.dumps(d,indent=2))
          assert d['archive_inventory'], d
          PY
      - name: Persist recovery audit
        run: |
          git config user.name "cerebellum-pyq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/analysis/native_archive_recovery_audit.json
          git diff --cached --quiet || git commit -m "Persist native archive recovery audit"
          git push
