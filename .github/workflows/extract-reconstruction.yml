name: Cerebillum Reconstruction
on:
  push:
    paths-ignore:
      - 'reconstruction/**'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify ZIPs
        run: |
          set -e
          for z in 01_core_dex.zip 02_dex_3_4.zip 03_dex5_lib_assets.zip 04_remaining_resources.zip; do
            test -s "$z"
            unzip -tqq "$z"
          done

      - name: Extract to staging
        run: |
          set -e
          rm -rf reconstruction/_staging reconstruction/apk_root reconstruction/analysis
          mkdir -p reconstruction/_staging reconstruction/apk_root reconstruction/analysis
          for z in 01_core_dex.zip 02_dex_3_4.zip 03_dex5_lib_assets.zip 04_remaining_resources.zip; do
            unzip -q -o "$z" -d reconstruction/_staging
          done

      - name: Organize APK tree
        run: |
          set -e
          cd reconstruction/_staging
          root="$GITHUB_WORKSPACE/reconstruction/apk_root"
          mkdir -p "$root"/{manifest,dex,resources,resources/xml,resources/other,assets,lib,meta-inf,media,config,archives,unknown}

          move_file() {
            src="$1"; dest="$2"
            mkdir -p "$(dirname "$root/$dest")"
            mv "$src" "$root/$dest"
          }

          # Standard APK top-level entries.
          [ ! -e AndroidManifest.xml ] || move_file AndroidManifest.xml manifest/AndroidManifest.xml
          for f in classes*.dex; do
            [ -e "$f" ] || continue
            move_file "$f" "dex/$f"
          done
          [ ! -e resources.arsc ] || move_file resources.arsc resources/resources.arsc

          # Preserve standard APK directories with their original internal paths.
          for d in assets lib res META-INF; do
            if [ -d "$d" ]; then
              target="$root/$d"
              mkdir -p "$target"
              cp -a "$d"/. "$target"/
              rm -rf "$d"
            fi
          done

          # Root-level XML/config/media/archive files.
          find . -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
            b="${f#./}"
            case "$b" in
              *.xml) move_file "$f" "resources/xml/$b" ;;
              *.json|*.properties|*.cfg|*.conf|*.ini|*.txt) move_file "$f" "config/$b" ;;
              *.png|*.jpg|*.jpeg|*.webp|*.gif|*.bmp|*.svg|*.avif|*.ico) move_file "$f" "media/$b" ;;
              *.zip|*.jar|*.aar|*.apk|*.aab|*.7z|*.gz|*.tar|*.xz) move_file "$f" "archives/$b" ;;
              *) ;;
            esac
          done

          # Extension-less/obfuscated root files: classify by magic, never discard.
          find . -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
            b="${f#./}"
            [ -e "$f" ] || continue
            kind="$(file -b "$f")"
            case "$kind" in
              *DEX*) dest="dex/$b" ;;
              *ELF*) dest="lib/$b" ;;
              *XML*|*xml*) dest="resources/xml/$b" ;;
              *PNG*|*JPEG*|*GIF*|*WebP*|*SVG*) dest="media/$b" ;;
              *Zip*|*Java*archive*|*gzip*|*XZ*) dest="archives/$b" ;;
              *JSON*|*text*|*ASCII*) dest="config/$b" ;;
              *) dest="unknown/$b" ;;
            esac
            move_file "$f" "$dest"
          done

          # Anything unexpectedly left in staging is retained under unknown.
          find . -mindepth 1 -print0 | while IFS= read -r -d '' p; do
            rel="${p#./}"
            [ -e "$p" ] || continue
            if [ -d "$p" ]; then
              mkdir -p "$root/unknown/$rel"
              cp -a "$p"/. "$root/unknown/$rel"/ 2>/dev/null || true
            else
              mkdir -p "$root/unknown/$(dirname "$rel")"
              mv "$p" "$root/unknown/$rel"
            fi
          done

          rm -rf "$GITHUB_WORKSPACE/reconstruction/_staging"

      - name: Build organization manifest
        run: |
          set -e
          root="reconstruction/apk_root"
          a="reconstruction/analysis"
          find "$root" -type f -print | sort > "$a/ORGANIZED_FILE_LIST.txt"
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$a/ORGANIZED_SHA256.txt"

          {
            echo "# Cerebillum Organized Reconstruction"
            echo
            echo "## Layout"
            echo "- manifest/ — Android manifest"
            echo "- dex/ — DEX bytecode"
            echo "- resources/ — resources.arsc and XML/other resource files"
            echo "- assets/ — application assets"
            echo "- lib/ — native libraries and ELF binaries"
            echo "- res/ — original Android res tree"
            echo "- meta-inf/ — original META-INF tree"
            echo "- media/ — image/media files"
            echo "- config/ — JSON/config/text files"
            echo "- archives/ — nested archives/APK/JAR/etc."
            echo "- unknown/ — files whose type could not be safely classified"
            echo
            echo "## Counts"
            printf "Total files: "; find "$root" -type f | wc -l
            for d in manifest dex resources assets lib res meta-inf media config archives unknown; do
              printf "%-10s " "$d:"
              find "$root/$d" -type f 2>/dev/null | wc -l
            done
            echo
            echo "## DEX"
            find "$root/dex" -type f -print | sort
            echo
            echo "## Native libraries"
            find "$root/lib" -type f -print | sort
          } > "$a/ORGANIZATION_MANIFEST.md"

      - name: Commit organized reconstruction
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconstruction
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Organize Cerebillum reconstruction tree'
          git push origin HEAD:main


  analyze:
    needs: extract
    strategy:
      fail-fast: false
      matrix:
        batch: [structure, dex, native, resources, media-assets, unknown]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Analyze batch
        run: |
          set -e
          root="reconstruction/apk_root"
          out="reconstruction/analysis/batches"
          mkdir -p "$out"
          case "${{ matrix.batch }}" in
            structure)
              {
                echo "# Structure Batch"
                echo
                find "$root" -maxdepth 2 -type d -print | sort
                echo
                echo "Top-level files:"
                find "$root" -maxdepth 1 -type f -printf '%f\\t%s bytes\\n' | sort
              } > "$out/structure.md"
              ;;
            dex)
              {
                echo "# DEX Batch"
                echo
                for f in "$root"/dex/*.dex; do
                  echo "## $(basename "$f")"
                  stat -c 'Size: %s bytes' "$f"
                  sha256sum "$f"
                  echo
                done
              } > "$out/dex.md"
              ;;
            native)
              {
                echo "# Native Batch"
                echo
                find "$root/lib" -type f -print | sort
                echo
                find "$root/lib" -type f -printf '%s\\t%p\\n' | sort -nr
              } > "$out/native.md"
              ;;
            resources)
              {
                echo "# Resources Batch"
                echo
                find "$root/resources" -type f -printf '%s\\t%p\\n' | sort -nr | head -300
                echo
                echo "Resource file count: $(find "$root/resources" -type f | wc -l)"
              } > "$out/resources.md"
              ;;
            media-assets)
              {
                echo "# Media + Assets Batch"
                echo
                echo "Media count: $(find "$root/media" -type f | wc -l)"
                echo "Asset count: $(find "$root/assets" -type f | wc -l)"
                echo
                echo "Largest media:"
                find "$root/media" -type f -printf '%s\\t%p\\n' | sort -nr | head -100
              } > "$out/media-assets.md"
              ;;
            unknown)
              {
                echo "# Unknown Batch"
                echo
                echo "Unknown count: $(find "$root/unknown" -type f | wc -l)"
                echo
                file "$root"/unknown/* 2>/dev/null | head -300 || true
              } > "$out/unknown.md"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: cerebillum-${{ matrix.batch }}
          path: reconstruction/analysis/batches/${{ matrix.batch }}.md

  aggregate-analysis:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: cerebillum-*
          path: reconstruction/analysis/batches
          merge-multiple: true
      - name: Commit parallel analysis
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconstruction/analysis/batches
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add parallel Cerebillum reconstruction analysis'
          git push origin HEAD:main

  deep-analysis:
    needs: aggregate-analysis
    strategy:
      fail-fast: false
      matrix:
        batch: [manifest, dex-symbols, native-elf, media-types, unknown-types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install analysis tools
        run: |
          set -e
          mkdir -p "$HOME/tools"
          case "${{ matrix.batch }}" in
            manifest)
              url="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name|endswith(".jar")) | .browser_download_url' | head -1)"
              test -n "$url" && test "$url" != "null"
              curl -L --fail --retry 3 -o "$HOME/tools/apktool.jar" "$url"
              ;;
            dex-symbols)
              url="$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest | jq -r '.assets[] | select(.name|endswith(".zip")) | .browser_download_url' | head -1)"
              test -n "$url" && test "$url" != "null"
              curl -L --fail --retry 3 -o "$HOME/tools/jadx.zip" "$url"
              unzip -q "$HOME/tools/jadx.zip" -d "$HOME/tools/jadx"
              chmod +x "$HOME/tools/jadx/bin/jadx"
              ;;
            *) ;;
          esac
      - name: Run deep batch
        run: |
          set -e
          root="reconstruction/apk_root"
          out="reconstruction/analysis/deep"
          mkdir -p "$out"
          case "${{ matrix.batch }}" in
            manifest)
              rm -rf /tmp/cerebillum-apk /tmp/cerebillum-decoded
              mkdir -p /tmp/cerebillum-apk
              # Reconstruct a valid APK top-level layout from the organized tree.
              cp "$root/manifest/AndroidManifest.xml" /tmp/cerebillum-apk/AndroidManifest.xml
              cp "$root/resources/resources.arsc" /tmp/cerebillum-apk/resources.arsc
              cp -a "$root/dex"/. /tmp/cerebillum-apk/ 2>/dev/null || true
              cp -a "$root/assets" /tmp/cerebillum-apk/ 2>/dev/null || true
              cp -a "$root/lib" /tmp/cerebillum-apk/ 2>/dev/null || true
              cp -a "$root/res" /tmp/cerebillum-apk/ 2>/dev/null || true
              cp -a "$root/meta-inf" /tmp/cerebillum-apk/META-INF 2>/dev/null || true
              (cd /tmp/cerebillum-apk && zip -q -r /tmp/cerebillum.apk .)
              unzip -tqq /tmp/cerebillum.apk
              java -jar "$HOME/tools/apktool.jar" d /tmp/cerebillum.apk -o /tmp/cerebillum-decoded --force >/tmp/apktool.log 2>&1 || { cat /tmp/apktool.log; exit 1; }
              {
                echo "# Manifest Deep Analysis"
                echo
                echo "## Decoded AndroidManifest.xml"
                cat /tmp/cerebillum-decoded/AndroidManifest.xml
                echo
                echo "## Apktool log"
                cat /tmp/apktool.log
                echo
                echo "## Resource directory counts"
                find /tmp/cerebillum-decoded/res -type f 2>/dev/null | wc -l
              } > "$out/manifest.md"
              ;;
            dex-symbols)
              {
                echo "# DEX Deep Analysis"
                for f in "$root"/dex/*.dex; do
                  echo
                  echo "## $(basename "$f")"
                  echo "Size: $(stat -c '%s' "$f") bytes"
                  echo "SHA256: $(sha256sum "$f" | cut -d' ' -f1)"
                  mkdir -p /tmp/jadx/$(basename "$f" .dex)
                  "$HOME/tools/jadx/bin/jadx" --no-res --no-imports --show-bad-code -d /tmp/jadx/$(basename "$f" .dex) "$f" >/tmp/jadx.log 2>&1 || true
                  find /tmp/jadx/$(basename "$f" .dex) -type f -name '*.java' | wc -l | awk '{print "Decompiled Java files: "$1}'
                  find /tmp/jadx/$(basename "$f" .dex) -type f -name '*.java' -print | sed 's#.*/src/##' | head -200
                done
              } > "$out/dex-symbols.md"
              ;;
            native-elf)
              {
                echo "# Native ELF Deep Analysis"
                find "$root/lib" -type f -name '*.so' -print0 | while IFS= read -r -d '' f; do
                  echo
                  echo "## $f"
                  file "$f"
                  readelf -h "$f" 2>/dev/null | grep -E 'Class:|Machine:|Type:|Entry point:' || true
                  readelf -d "$f" 2>/dev/null | grep -E 'SONAME|NEEDED' || true
                  echo "SHA256: $(sha256sum "$f" | cut -d' ' -f1)"
                done
              } > "$out/native-elf.md"
              ;;
            media-types)
              {
                echo "# Media Type Deep Analysis"
                find "$root/media" "$root/assets" -type f -print0 | while IFS= read -r -d '' f; do
                  printf '%s\t%s\n' "$(file -b "$f")" "$f"
                done | sort
              } > "$out/media-types.md"
              ;;
            unknown-types)
              {
                echo "# Unknown Type Deep Analysis"
                find "$root/unknown" -type f -print0 | while IFS= read -r -d '' f; do
                  printf '%s\t%s\n' "$(file -b "$f")" "$f"
                done | sort
              } > "$out/unknown-types.md"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: cerebillum-deep-${{ matrix.batch }}
          path: reconstruction/analysis/deep/${{ matrix.batch }}.md

  aggregate-deep-analysis:
    needs: deep-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: cerebillum-deep-*
          path: reconstruction/analysis/deep
          merge-multiple: true
      - name: Commit deep analysis
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconstruction/analysis/deep
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add deep Cerebillum reconstruction analysis'
          git push origin HEAD:main

  autonomous-controller:
    needs: aggregate-deep-analysis
    if: ${{ needs.aggregate-deep-analysis.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Autonomous pipeline controller
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reconstruction/automation
          state="reconstruction/automation/STATE.md"
          log="reconstruction/automation/controller.log"
          exec > >(tee -a "$log") 2>&1

          phase() {
            printf '%s\n' "$1" > "$state"
            echo "=== $1 ==="
          }

          retry() {
            local n=1 max=3
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "FAILED after $max attempts: $*"
                return 1
              fi
              echo "Retry $n/$max: $*"
              n=$((n+1))
              sleep 5
            done
          }

          phase "EXTRACTED"
          test -d reconstruction/apk_root
          test -f reconstruction/analysis/ORGANIZATION_MANIFEST.md

          phase "PARALLEL_ANALYSIS_COMPLETE"
          for f in             reconstruction/analysis/batches/structure.md             reconstruction/analysis/batches/dex.md             reconstruction/analysis/batches/native.md             reconstruction/analysis/batches/resources.md             reconstruction/analysis/batches/media-assets.md             reconstruction/analysis/batches/unknown.md; do
            test -s "$f"
          done

          phase "DEEP_ANALYSIS_COMPLETE"
          for f in             reconstruction/analysis/deep/manifest.md             reconstruction/analysis/deep/dex-symbols.md             reconstruction/analysis/deep/native-elf.md             reconstruction/analysis/deep/media-types.md             reconstruction/analysis/deep/unknown-types.md; do
            test -s "$f"
          done

          phase "RECONSTRUCTION_READY"
          mkdir -p reconstruction/project reconstruction/build reconstruction/validation

          # Determine the next executable reconstruction target automatically.
          if [ -f reconstruction/project/settings.gradle ] || [ -f reconstruction/project/settings.gradle.kts ]; then
            echo "Existing Android project detected."
            phase "BUILD_PENDING"
          elif [ -f reconstruction/project/build.gradle ] || [ -f reconstruction/project/build.gradle.kts ]; then
            echo "Existing Gradle project detected."
            phase "BUILD_PENDING"
          else
            echo "No Android project exists yet; generating machine-readable reconstruction manifest."
            {
              echo "# Autonomous Reconstruction Manifest"
              echo
              echo "Generated: $(date -u +%FT%TZ)"
              echo
              echo "## Source"
              find reconstruction/apk_root -type f | sort
              echo
              echo "## Analysis"
              find reconstruction/analysis -type f | sort
              echo
              echo "## Next automated target"
              echo "Create Android-compatible project from verified manifest/DEX/native/resource inventory."
            } > reconstruction/project/RECONSTRUCTION_MANIFEST.md
            phase "PROJECT_GENERATION_PENDING"
          fi

          phase "AUTOMATION_HEALTHY"
          echo "Controller completed without manual intervention."

      - name: Commit controller state
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconstruction/automation reconstruction/project
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Run autonomous Cerebillum pipeline controller'
          git push origin HEAD:main


  autonomous-build:
    needs: autonomous-controller
    if: ${{ needs.autonomous-controller.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Reconstruct original APK tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf reconstruction/build/apk-tree reconstruction/build/output
          mkdir -p reconstruction/build/apk-tree reconstruction/build/output
          for z in 01_core_dex.zip 02_dex_3_4.zip 03_dex5_lib_assets.zip 04_remaining_resources.zip; do
            test -s "$z"
            unzip -q -o "$z" -d reconstruction/build/apk-tree
          done
          test -f reconstruction/build/apk-tree/AndroidManifest.xml
          test -f reconstruction/build/apk-tree/resources.arsc
          ls reconstruction/build/apk-tree/classes*.dex >/dev/null
          unzip -tqq 01_core_dex.zip
          unzip -tqq 02_dex_3_4.zip
          unzip -tqq 03_dex5_lib_assets.zip
          unzip -tqq 04_remaining_resources.zip

      - name: Repack APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd reconstruction/build/apk-tree
          rm -f META-INF/*.SF META-INF/*.RSA META-INF/*.DSA META-INF/MANIFEST.MF 2>/dev/null || true
          zip -q -r -X ../output/Cerebillum-reconstructed-unsigned.apk .
          unzip -tqq ../output/Cerebillum-reconstructed-unsigned.apk

      - name: Make reconstructed APK coexist with original
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p reconstruction/build/decoded reconstruction/build/rebuilt
          curl -L --fail --retry 3 -o reconstruction/build/apktool.jar \
            "$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name|endswith(".jar")) | .browser_download_url' | head -1)"
          java -jar reconstruction/build/apktool.jar d \
            reconstruction/build/output/Cerebillum-reconstructed-unsigned.apk \
            -o reconstruction/build/decoded --force
          python3 - <<'PY'
from pathlib import Path
p = Path("reconstruction/build/decoded/AndroidManifest.xml")
s = p.read_text()
s = s.replace('package="com.marrow"', 'package="com.marrow.reconstructed"', 1)
s = s.replace('com.marrow.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION', 'com.marrow.reconstructed.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION')
for old, new in [
    ('com.marrow.fileprovider', 'com.marrow.reconstructed.fileprovider'),
    ('com.marrow.data.provider', 'com.marrow.reconstructed.data.provider'),
    ('com.marrow.clevertap.fileprovider', 'com.marrow.reconstructed.clevertap.fileprovider'),
    ('com.marrow.FacebookInitProvider', 'com.marrow.reconstructed.FacebookInitProvider'),
    ('com.marrow.firebaseinitprovider', 'com.marrow.reconstructed.firebaseinitprovider'),
]:
    s = s.replace(old, new)
p.write_text(s)
PY
          java -jar reconstruction/build/apktool.jar b reconstruction/build/decoded \
            -o reconstruction/build/rebuilt/Cerebillum-reconstructed-coexist-unsigned.apk
          test -s reconstruction/build/rebuilt/Cerebillum-reconstructed-coexist-unsigned.apk

      - name: Align and sign APK
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          keytool -genkeypair -v -keystore reconstruction/build/cerebillum-debug.keystore             -alias cerebillum -keyalg RSA -keysize 2048 -validity 10000             -storepass android -keypass android             -dname "CN=Cerebillum Reconstruction,O=OpenAI Reconstruction,C=US"
          "$BUILD_TOOLS/zipalign" -f -p 4             reconstruction/build/rebuilt/Cerebillum-reconstructed-coexist-unsigned.apk             reconstruction/build/output/Cerebillum-reconstructed-aligned.apk
          "$BUILD_TOOLS/apksigner" sign             --ks reconstruction/build/cerebillum-debug.keystore             --ks-pass pass:android             --key-pass pass:android             --out reconstruction/build/output/Cerebillum-reconstructed.apk             reconstruction/build/output/Cerebillum-reconstructed-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose reconstruction/build/output/Cerebillum-reconstructed.apk

      - name: Runtime APK validation
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="reconstruction/build/output/Cerebillum-reconstructed.apk"
          mkdir -p reconstruction/validation
          test -s "$apk"
          unzip -tqq "$apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          if [ -x "$BUILD_TOOLS/aapt" ]; then
            "$BUILD_TOOLS/aapt" dump badging "$apk" > reconstruction/validation/apk-badging.txt
            grep -E '^package:|^application-label:|^launchable-activity:' reconstruction/validation/apk-badging.txt || true
          fi
          sha256sum "$apk" | tee reconstruction/validation/Cerebillum-reconstructed.sha256
          stat -c 'APK size: %s bytes' "$apk" | tee reconstruction/validation/APK_SIZE.txt

      - name: Upload reconstructed APK
        uses: actions/upload-artifact@v4
        with:
          name: Cerebillum-reconstructed-APK
          path: |
            reconstruction/build/output/Cerebillum-reconstructed.apk
            reconstruction/validation/apk-badging.txt
            reconstruction/validation/Cerebillum-reconstructed.sha256
            reconstruction/validation/APK_SIZE.txt
