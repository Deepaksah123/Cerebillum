name: Extract APK reconstruction parts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare reconstruction workspace
        run: |
          set -e
          rm -rf reconstruction/imported_apk
          mkdir -p reconstruction/imported_apk
          for z in 01_core_dex.zip 02_dex_3_4.zip 03_dex5_lib_assets.zip 04_remaining_resources.zip; do
            test -f "$z"
            unzip -q -o "$z" -d reconstruction/imported_apk
          done

      - name: Generate inventory and provenance
        run: |
          set -e
          mkdir -p reconstruction/analysis
          find reconstruction/imported_apk -type f -print0 | sort -z | xargs -0 sha256sum > reconstruction/analysis/EXTRACTED_SHA256.txt
          find reconstruction/imported_apk -type f | sort > reconstruction/analysis/EXTRACTED_FILE_LIST.txt
          {
            echo "# Imported APK Reconstruction"
            echo
            echo "Source ZIPs: 4"
            echo
            echo "- 01_core_dex.zip"
            echo "- 02_dex_3_4.zip"
            echo "- 03_dex5_lib_assets.zip"
            echo "- 04_remaining_resources.zip"
            echo
            echo "The ZIP paths were extracted without flattening or renaming."
            echo "This workspace is an extraction/import stage; Java/Kotlin source decompilation is a separate stage."
            echo
            echo "## Package indicators"
            grep -RaoE 'com\.[A-Za-z0-9_$.]+' reconstruction/imported_apk 2>/dev/null | sort -u | head -200 > reconstruction/analysis/PACKAGE_INDICATORS.txt || true
            echo
            echo "## File count"
            find reconstruction/imported_apk -type f | wc -l
          } > reconstruction/analysis/IMPORT_MANIFEST.md

      - name: Organize reconstruction metadata
        run: |
          set -e
          cat > reconstruction/README.md <<'EOF'
# APK Reconstruction Workspace

This directory contains the exact extracted file tree from the four uploaded ZIP parts.

## Layout

- `imported_apk/` — original APK paths, preserved as extracted
- `analysis/EXTRACTED_FILE_LIST.txt` — complete extracted file inventory
- `analysis/EXTRACTED_SHA256.txt` — SHA-256 per extracted file
- `analysis/PACKAGE_INDICATORS.txt` — package/class namespace indicators
- `analysis/IMPORT_MANIFEST.md` — provenance and extraction notes

No files are renamed or flattened during the import stage.

## Important

Raw APK extraction is not the same as Java/Kotlin/Smali decompilation. The DEX files remain bytecode until a decompiler stage is run.
EOF

      - name: Commit extracted reconstruction
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction
          git commit -m "Extract uploaded APK reconstruction parts" || exit 0
          git push
