name: Cerebillum Reconstruction
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ZIPs
        run: |
          set -e
          for z in 01_core_dex.zip 02_dex_3_4.zip 03_dex5_lib_assets.zip 04_remaining_resources.zip; do
            test -s "$z"
            unzip -tqq "$z"
          done
      - name: Extract
        run: |
          set -e
          rm -rf reconstruction/apk_root reconstruction/analysis
          mkdir -p reconstruction/apk_root reconstruction/analysis
          for z in 01_core_dex.zip 02_dex_3_4.zip 03_dex5_lib_assets.zip 04_remaining_resources.zip; do
            unzip -q -o "$z" -d reconstruction/apk_root
          done
      - name: Inventory
        run: |
          set -e
          find reconstruction/apk_root -type f -print | sort > reconstruction/analysis/EXTRACTED_FILE_LIST.txt
          find reconstruction/apk_root -type f -print0 | sort -z | xargs -0 sha256sum > reconstruction/analysis/EXTRACTED_SHA256.txt
          echo '# Cerebillum Reconstruction Manifest' > reconstruction/analysis/IMPORT_MANIFEST.md
          echo >> reconstruction/analysis/IMPORT_MANIFEST.md
          echo 'Extracted file count:' >> reconstruction/analysis/IMPORT_MANIFEST.md
          find reconstruction/apk_root -type f | wc -l >> reconstruction/analysis/IMPORT_MANIFEST.md
          echo >> reconstruction/analysis/IMPORT_MANIFEST.md
          echo 'DEX files:' >> reconstruction/analysis/IMPORT_MANIFEST.md
          find reconstruction/apk_root -type f -name '*.dex' -print | sort >> reconstruction/analysis/IMPORT_MANIFEST.md
      - name: Commit reconstruction
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reconstruction
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract Cerebillum reconstruction tree'
          git push origin HEAD:main
