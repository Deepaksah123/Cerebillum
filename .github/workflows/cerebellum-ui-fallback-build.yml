name: Cerebellum UI Fallback Build
# Parallel-install identity fix verification build

on:
  push:
    paths:
      - 'app/**'
      - 'reconstruction/cerebellum_ui_chunks/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/cerebellum-ui-fallback-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify genuine Hermes APK payload
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          size="$(unzip -p "$apk" assets/index.android.bundle | wc -c | tr -d ' ')"
          test "$size" = "11206868"
          sha="$(unzip -p "$apk" assets/index.android.bundle | sha256sum | awk '{print $1}')"
          test "$sha" = "d0e2d33a709316ae8fc55afd24b2540f6ab50e72ab2a9dbcaac419731be5afe2"
          if unzip -p "$apk" classes.dex 2>/dev/null | strings | grep -Eq 'com[/\\.]facebook[/\\.]react[/\\.]ReactActivity'; then
            echo "PASS: React Native Activity reference present."
          else
            echo "FAIL: React Native Activity reference not found in APK dex."
            exit 1
          fi
          echo "PASS: APK contains exact authoritative Hermes bundle."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          retention-days: 14
