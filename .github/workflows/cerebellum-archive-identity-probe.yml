name: Cerebellum Archive Identity Probe

on:
  push:
    branches: [cerebellum-pyq-phase1]
    paths:
      - '01_core_dex.zip'
      - '02_dex_3_4.zip'
      - '03_dex5_lib_assets.zip'
      - '04_remaining_resources.zip'
      - 'reconstruction/automation/cerebellum_archive_identity_probe.py'
      - '.github/workflows/cerebellum-archive-identity-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install forensic APK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool jadx zip unzip
      - name: Assemble and verify archive candidate
        run: python3 reconstruction/automation/cerebellum_archive_identity_probe.py
      - name: Persist probe
        if: always()
        run: |
          git config user.name "cerebellum-native-probe-bot"
          git config user.email "41898282+github-actions[bot]@noreply.github.com"
          git add reconstruction/analysis/cerebellum_archive_identity_probe.json
          git diff --cached --quiet || git commit -m "Persist Cerebellum archive identity probe"
          git push
