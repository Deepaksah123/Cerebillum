plugins { id 'com.android.application' }

android {
    namespace 'com.cerebellummobileapp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cerebellummobileapp'
        minSdk 26
        targetSdk 36
        versionCode 172
        versionName '1.16.2'
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main {
            assets.srcDirs += ["$rootDir/reconstruction/cerebellum_ui_chunks"]
        }
    }
}

dependencies { }
