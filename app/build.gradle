plugins { id 'com.android.application' }

android {
    namespace 'com.cerebellummobileapp.reconstructed'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cerebellummobileapp.reconstructed'
        minSdk 26
        targetSdk 36
        versionCode 172
        versionName '1.16.2'
    }

    buildFeatures { buildConfig true }

    // Release APKs must be signed so Android can install them.
    // CI uses the standard Android debug keystore when no production
    // keystore is supplied; this is intentional for the reconstructed
    // parallel-install APK and is not a production signing key.
    signingConfigs {
        release {
            storeFile = file(System.getenv('CEREBELLUM_RELEASE_STORE_FILE') ?: System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword = System.getenv('CEREBELLUM_RELEASE_STORE_PASSWORD') ?: 'android'
            keyAlias = System.getenv('CEREBELLUM_RELEASE_KEY_ALIAS') ?: 'AndroidDebugKey'
            keyPassword = System.getenv('CEREBELLUM_RELEASE_KEY_PASSWORD') ?: 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ["$rootDir/reconstruction/native_source"]
            assets.srcDirs += ["$rootDir/reconstruction/cerebellum_ui_chunks"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android:0.81.0")
    implementation("com.facebook.react:hermes-android:0.81.0")
}
